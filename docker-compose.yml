services:
  bitdash:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BITDASH_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      FRONTEND_DIST: /app/frontend/dist
      ITEM_NAME_FILE: /var/lib/bitdash/item-names.json
      BITJITA_CACHE_DIR: /var/lib/bitdash/bitjita-cache
      XP_HISTORY_DIR: /var/lib/bitdash/xp-history
      DASHBOARD_DIR: /var/lib/bitdash/dashboards
      DASHBOARD_TEMPLATE_FILE: ${DASHBOARD_TEMPLATE_FILE:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-300}
      BITJITA_BASE_URL: ${BITJITA_BASE_URL:-https://bitjita.com}
    volumes:
      - bitdash-data:/var/lib/bitdash
    restart: unless-stopped

volumes:
  bitdash-data:
